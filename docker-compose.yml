  backend:
    image: ${BACKEND_IMAGE:-piactl-socks5-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pia-socks5-api
    mem_limit: 512m
    env_file:
      - .env
    environment:
      CREDENTIALS_CONTAINER_PATH: /app/credentials
      PIA_ACCOUNT: ""
      PIA_ACCOUNT_STORAGE_ENABLED: "true"
      PIA_ACCOUNT_PATH: /app/credentials/pia_account_1
      PIA_ACCOUNT_PATH_2: /app/credentials/pia_account_2
      PROXY_SERVICE_HOST: proxy-gateway
      HAPROXY_RUNTIME_SOCKET: /run/haproxy/admin.sock
      WORKER_COUNT: ${WORKER_COUNT:-36}
      MAX_WORKER_COUNT: ${MAX_WORKER_COUNT:-36}
      PROXY_WORKERS: ${PROXY_WORKERS:-auto}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
