x-vpn-worker: &vpn_worker
  image: ${WORKER_IMAGE:-piactl-socks5-proxy:local}
  env_file:
    - .env
  expose:
    - "1080"
    - "9000"
  networks:
    - pia_proxy_net
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_PTRACE
  devices:
    - /dev/net/tun:/dev/net/tun:rwm
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "0"
  volumes:
    - ./credentials:/app/credentials
  restart: unless-stopped
  mem_limit: 384m
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PROXY_CONTROL_PORT:-9000}/healthz"]
    interval: 20s
    timeout: 4s
    retries: 4
    start_period: 30s
  logging:
    driver: "json-file"
    options:
      max-size: "5m"
      max-file: "2"

services:
  proxy-gateway:
    image: haproxy:2.9
    container_name: pia-proxy-gateway
    user: "0:0"
    mem_limit: 128m
    command:
      - sh
      - -ec
      - |
        mkdir -p /run/haproxy
        chmod 777 /run/haproxy
        worker_count="$${WORKER_COUNT:-36}"
        case "$$worker_count" in
          ''|*[!0-9]*) worker_count=36 ;;
          *)
            if [ "$$worker_count" -gt 36 ]; then
              worker_count=36
            elif [ "$$worker_count" -lt 1 ]; then
              worker_count=8
            fi
            ;;
        esac
        cat >/tmp/haproxy.cfg <<'EOF'
        global
            log stdout format raw local0
            stats socket /run/haproxy/admin.sock mode 666 level admin expose-fd listeners
            maxconn 4096

        resolvers docker_resolver
            nameserver dns1 127.0.0.11:53
            resolve_retries 3
            timeout resolve 1s
            timeout retry 1s
            hold other 10s
            hold refused 10s
            hold nx 10s
            hold timeout 10s
            hold valid 10s
            hold obsolete 10s

        defaults
            log global
            mode tcp
            option tcplog
            timeout queue 5s
            timeout connect 5s
            timeout client 60s
            timeout server 60s

        frontend socks5_gateway
            bind *:1080
            default_backend socks5_workers

        backend socks5_workers
            balance roundrobin
            option httpchk GET /healthz
            http-check expect status 200
            default-server init-addr last,libc,none resolvers docker_resolver check port 9000 inter 2s fastinter 1s fall 2 rise 2

        EOF
        for i in $$(seq 1 "$$worker_count"); do
          printf '    server worker%s vpn-worker-%s:1080 check port 9000\n' "$$i" "$$i" >>/tmp/haproxy.cfg
        done
        cat >>/tmp/haproxy.cfg <<'EOF'
        listen stats
            bind *:8404
            mode http
            stats enable
            stats uri /
            stats refresh 5s
        EOF
        exec haproxy -W -db -f /tmp/haproxy.cfg
    env_file:
      - .env
    environment:
      WORKER_COUNT: ${WORKER_COUNT:-36}
      MAX_WORKER_COUNT: ${MAX_WORKER_COUNT:-36}
    ports:
      - "${PROXY_HOST:-127.0.0.1}:${PROXY_PORT:-1087}:1080"
      - "127.0.0.1:${HAPROXY_STATS_PORT:-8411}:8404"
    volumes:
      - haproxy_runtime:/run/haproxy
    networks:
      - pia_proxy_net
    depends_on:
      vpn-worker-1:
        condition: service_started
      vpn-worker-2:
        condition: service_started
      vpn-worker-3:
        condition: service_started
      vpn-worker-4:
        condition: service_started
      vpn-worker-5:
        condition: service_started
      vpn-worker-6:
        condition: service_started
      vpn-worker-7:
        condition: service_started
      vpn-worker-8:
        condition: service_started
      vpn-worker-9:
        condition: service_started
      vpn-worker-10:
        condition: service_started
      vpn-worker-11:
        condition: service_started
      vpn-worker-12:
        condition: service_started
      vpn-worker-13:
        condition: service_started
      vpn-worker-14:
        condition: service_started
      vpn-worker-15:
        condition: service_started
      vpn-worker-16:
        condition: service_started
      vpn-worker-17:
        condition: service_started
      vpn-worker-18:
        condition: service_started
      vpn-worker-19:
        condition: service_started
      vpn-worker-20:
        condition: service_started
      vpn-worker-21:
        condition: service_started
      vpn-worker-22:
        condition: service_started
      vpn-worker-23:
        condition: service_started
      vpn-worker-24:
        condition: service_started
      vpn-worker-25:
        condition: service_started
      vpn-worker-26:
        condition: service_started
      vpn-worker-27:
        condition: service_started
      vpn-worker-28:
        condition: service_started
      vpn-worker-29:
        condition: service_started
      vpn-worker-30:
        condition: service_started
      vpn-worker-31:
        condition: service_started
      vpn-worker-32:
        condition: service_started
      vpn-worker-33:
        condition: service_started
      vpn-worker-34:
        condition: service_started
      vpn-worker-35:
        condition: service_started
      vpn-worker-36:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/haproxy/admin.sock"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-worker-1:
    <<: *vpn_worker
    build:
      context: .
      dockerfile: app/docker/proxy/Dockerfile
    container_name: pia-worker-1
    environment: &worker_env
      WORKER_ID: worker1
      TOKEN_SLOT: "1"
      CREDENTIALS_CONTAINER_PATH: /app/credentials
      PIA_ACCOUNT: ""
      PIA_ACCOUNT_STORAGE_ENABLED: "true"
      PIA_ACCOUNT_PATH: /app/credentials/pia_account_1
      PROXY_LOG_PATH: /tmp/proxy-runtime.log
      PROXY_CONTROL_PORT: ${PROXY_CONTROL_PORT:-9000}
      SOCKS5_PORT: ${SOCKS5_PORT:-1080}
      PIA_CONNECT_ON_STARTUP: ${PIA_CONNECT_ON_STARTUP:-true}
      PIA_STARTUP_TARGET: ${WORKER_1_COUNTRY:-random}

