[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pia-proxy"
version = "1.0.9"
description = "High-Performance PIA SOCKS5 Multi-Worker Proxy Gateway CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "zSOCKS Team" }
]
keywords = [
    "proxy",
    "socks5",
    "pia",
    "vpn",
    "vpn-gateway",
    "rotate-ip",
    "proxy-pool",
    "haproxy"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: Proxy Servers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/videoveo3pro-debug/pia"
Repository = "https://github.com/videoveo3pro-debug/pia.git"

[project.scripts]
pia-proxy = "cli.main:main"
zsocks = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.setuptools.package-data]
cli = ["templates/*", "templates/.*"]
